# Yazi keymap overrides (v26)
# smart-enter: directory -> enter, file -> opener (Helix)

[[mgr.prepend_keymap]]
on   = "enter"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

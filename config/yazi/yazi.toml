# Yazi config (v26)
# Default editor: Helix. Fetchers wire git.yazi for status indicators.

[mgr]
show_hidden = false
sort_by = "natural"
sort_dir_first = true
linemode = "mtime"

[opener]
edit = [
  { run = 'hx "$@"', desc = "Open in Helix", block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', desc = "Open with default app", for = "macos" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.jl", use = "edit" },
]

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"
